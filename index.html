<!doctype html>

<head>

<title>Mon Jardin</title>
<style>
:root{
  --bg:#f3f0e6;--bg2:#eae6d6;--card:#fbf9f3;--ink:#22301f;--muted:#6a7665;--line:#e2ddcb;
  --green:#4f7a4a;--green-d:#355a33;--leaf:#8fb27a;--sage:#e1e9d6;--clay:#c2674a;--clay-s:#f6e1d8;
  --sun:#d4a037;--sun-s:#f7ecd0;--sky:#4f89a3;--sky-s:#dcebf1;--plum:#8a5a82;--plum-s:#eddcea;
  --shadow:0 1px 2px rgba(40,55,35,.06),0 8px 24px rgba(40,55,35,.07);
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a13;--bg2:#1a2219;--card:#1e271d;--ink:#e7eadc;--muted:#99a692;--line:#2c382a;
  --green:#7fb069;--green-d:#a5cf8f;--leaf:#6f9a5c;--sage:#26341f;--clay:#e08a6d;--clay-s:#3a2a22;
  --sun:#e3b653;--sun-s:#3a3220;--sky:#7db4cc;--sky-s:#1f323b;--plum:#c18cb8;--plum-s:#35283a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(1200px 500px at 85% -10%,var(--sage),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:22px;padding:0 8px}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green);color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:var(--sage)}
.nav.on{background:var(--sage);color:var(--green-d);font-weight:600}
.side small{margin-top:auto;color:var(--muted);padding:0 8px}
main{padding:32px clamp(16px,4vw,48px) 60px;max-width:1100px;width:100%;min-width:0}
.tabbar{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,36px)}
.top p{margin:4px 0 0;color:var(--muted);text-transform:capitalize}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.sub{color:var(--muted);font-size:14px}
.btn{border:0;cursor:pointer;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:var(--sage);color:var(--green-d)}
.btn.warn{background:var(--clay-s);color:var(--clay)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sage);color:var(--green-d);white-space:nowrap}
.pill.taille{background:var(--clay-s);color:var(--clay)}
.pill.engrais{background:var(--sun-s);color:var(--sun)}
.pill.protection{background:var(--sky-s);color:var(--sky)}
.pill.traitement{background:var(--plum-s);color:var(--plum)}
.pill.récolte{background:var(--sun-s);color:#b8742a}
.pill.soin{background:var(--sage);color:var(--green-d)}
/* hero météo */
.hero{border-radius:28px;padding:26px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.hero.sun{background:linear-gradient(135deg,#6fa35c,#d3b04c)}
.hero.cloud{background:linear-gradient(135deg,#6f8a78,#9aaa9f)}
.hero.rain{background:linear-gradient(135deg,#3f6e84,#6f9a90)}
.hero.snow{background:linear-gradient(135deg,#7a97a8,#c3d3da)}
.hero.storm{background:linear-gradient(135deg,#46566a,#6c7a8a)}
.hero.fog{background:linear-gradient(135deg,#8a9a8f,#b6bfb3)}
.hero .big{display:flex;align-items:center;gap:16px}
.hero .t{font-family:var(--serif);font-size:64px;line-height:1;font-weight:500}
.hero .ic{font-size:56px}
.hero .loc{opacity:.9;font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:20px}
.day{background:rgba(255,255,255,.17);border-radius:14px;padding:8px 2px;text-align:center;font-size:13px;backdrop-filter:blur(4px)}
.day b{display:block;font-weight:600;text-transform:capitalize}
.day .e{font-size:22px}
.day .r{font-size:11px;opacity:.9;min-height:14px}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:10px;font-size:14.5px}
.alert.frost{background:var(--sky-s);color:var(--sky)}
.alert.heat{background:var(--clay-s);color:var(--clay)}
.alert.wind,.alert.rain{background:var(--plum-s);color:var(--plum)}
.alert b{display:block}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ico{width:40px;height:40px;border-radius:12px;background:var(--sage);display:grid;place-items:center;font-size:20px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{color:var(--muted);font-size:14px}
.chk{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--leaf);cursor:pointer;flex:none;display:grid;place-items:center;background:none}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
.task.done .tx{opacity:.5;text-decoration:line-through}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.tips{margin:0;padding-left:20px;color:var(--muted)}
.tips li{margin:4px 0}
.tips li::marker{color:var(--leaf)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:8px 0}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus,.in:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.pc:hover{transform:translateY(-2px)}
.pc .em{width:44px;height:44px;border-radius:14px;background:var(--sage);display:grid;place-items:center;font-size:24px}
.pc b{font-family:var(--serif);font-size:17px;line-height:1.2}
.pc i{font-size:12.5px;color:var(--muted)}
.pc .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
h3.sec{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-family:var(--sans);font-weight:600}
.fab{position:fixed;right:20px;bottom:24px;z-index:20;box-shadow:0 8px 24px rgba(40,70,35,.35);border-radius:99px;padding:14px 22px}
/* feuille */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,25,12,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--card);width:min(660px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet .hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet .hd .em{width:56px;height:56px;border-radius:18px;background:var(--sage);display:grid;place-items:center;font-size:30px}
.sheet .x{margin-left:auto;border:0;background:var(--sage);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0}
.mc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:10px;font-size:12px;color:var(--muted)}
.mc.cur{background:var(--sage);color:var(--green-d);font-weight:700}
.mc i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mc i.p{background:var(--clay)}.mc i.l{background:var(--green)}.mc i.f{background:var(--sun)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.in{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mgrid label{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500}
.mgrid input{display:none}
.mgrid input:checked+span{display:block;background:var(--green);color:#fff;border-radius:8px;margin:-6px 0;padding:6px 0}
.sec2{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.sec2 h4{margin:0 0 6px;font-size:14px}
.sec2 p{margin:4px 0;font-size:14.5px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
/* matrice */
.mx{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.mx table{border-collapse:collapse;width:100%;font-size:13px}
.mx th,.mx td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-left:12px;min-width:150px}
.mx td.cur,.mx th.cur{background:var(--sage)}
.mx .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 1px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  .side{display:none}
  main{padding:20px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .nav{flex-direction:column;gap:2px;padding:6px 0;font-size:11.5px;text-align:center;border-radius:12px}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));right:16px}
  .sheet{align-items:flex-end}
  .sheet .box{border-radius:26px 26px 0 0;max-height:94vh}
  .hero .t{font-size:52px}
  .days{gap:4px}.day{font-size:11.5px}.day .e{font-size:18px}
  #toast{bottom:100px}
}
.ph{position:relative;overflow:hidden;background:var(--sage);display:grid;place-items:center;flex:none;font-size:20px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .pcph{width:100%;aspect-ratio:4/3;border-radius:14px;font-size:38px}
.hd .hdph{width:68px;height:68px;border-radius:18px;font-size:32px}
.lnk{display:block;border:0;background:none;color:var(--green-d);font-weight:600;padding:6px 0 0;cursor:pointer;font-size:13.5px}
.steps{margin:6px 0;padding-left:22px}.steps li{margin:7px 0}.steps li::marker{color:var(--green);font-weight:700}
.nogo{margin:6px 0;padding-left:20px;color:var(--clay)}.nogo li{margin:5px 0}
.credit{font-size:12px;color:var(--muted);margin:10px 0 0}.credit a,.srcs a{color:var(--green-d)}
.srcs{margin:6px 0;padding-left:18px;font-size:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.rc .ph{width:100%;aspect-ratio:16/10;font-size:46px;cursor:pointer}
.rc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.rc h3{font-size:19px}
.rc .lat{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:-6px}
.sc{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--muted);align-items:center}
.dots{letter-spacing:2px;font-size:13px;color:var(--green)}
.dots.l0,.dots.l1{color:var(--clay)}.dots.l2{color:var(--sun)}
.rc p{margin:0;font-size:14px}
.rc .act{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.cl2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cl2 h4{margin:0 0 6px;font-size:15px}.cl2 ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}.cl2 li{margin:3px 0}
.vul{border-left:4px solid var(--clay);padding:4px 0 4px 12px;margin:10px 0}
.vul.w{border-color:var(--sun)}
.vul b{display:block}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
@media (max-width:860px){.cl2{grid-template-columns:1fr}.tabbar{grid-template-columns:repeat(5,1fr)!important}}
</style>
</head>

<script>
"use strict";

const $=s=>document.querySelector(s);

const CAT=[
{id:'elaeagnus',n:'Elaeagnus ebbingei',l:'Elaeagnus × submacrophylla',t:'haie',e:'🌿',w:0,s:'Soleil / mi-ombre',f:'Persistant',h:-20,wp:['Elaeagnus × submacrophylla','Elaeagnus × submacrophylla'],now:3,fut:3,

 note:'Rustique (≈ −20 °C), résiste au vent, aux embruns et au sec une fois installé ; éviter les sols très calcaires.',
 g:{q:'Mars (fin d’hiver). Il fleurit de septembre à novembre : tailler au printemps ne coûte donc pas la floraison.',o:OUT+' Taille-haie pour un linéaire important.',

/* ============ Logique d’arrosage ============ */
const daysSince=iso=>iso?Math.floor((Date.now()-new Date(iso).getTime())/864e5):null;
function litres(sp,young,pot){
  if(pot)return sp.t==='arbre'?10:4;
  const base={haie:6,arbuste:10,grimpante:8,arbre:25,fruitier:10}[sp.t]||8;
  const L=sp.id==='fraisier'?2:sp.id==='framboisier'?8:base;
  return Math.round(young?L:L*1.2);
}
function waterAdvice(P){
  const sp=getSp(P.sid);const i=T();
  if(!wx||i<0)return{s:'na',r:'Météo indisponible'};
  const d=wx.daily,m=new Date().getMonth()+1,young=P.age!=='old',pot=!!P.pot;
  const ds=daysSince(P.lastWater);
  const n=Math.max(0,Math.min(i,ds==null?7:Math.min(7,ds)));
  const sl=a=>a.slice(i-n,i);
  const et=sum(sl(d.et0_fao_evapotranspiration)),rain=sum(sl(d.precipitation_sum));
  const deficit=Math.max(0,et-0.8*rain);
  let thr=[32,22,14][sp.w];if(young)thr*=0.6;if(pot)thr*=0.5;
  if((d.temperature_2m_max[i]||0)>=32)thr*=0.75;
  const soon=(d.precipitation_sum[i]||0)+(d.precipitation_sum[i+1]||0);
  const winter=[11,12,1,2].includes(m);
  const L=litres(sp,young,pot);
  if(winter&&!pot)return{s:'skip',r:'Repos hivernal'};
  if((d.temperature_2m_min[i]??5)<=0)return{s:'skip',r:'Gel : ne pas arroser'};
  if(ds!=null&&ds<2)return{s:'skip',r:'Arrosé récemment'};
  if(deficit>=thr){
    if(soon>=5)return{s:'wait',r:'Pluie annoncée ('+Math.round(soon)+' mm) : attendre',L};
    return{s:'water',r:'Déficit hydrique '+Math.round(deficit)+' mm sur '+(n||7)+' j',L};
  }
  return{s:'skip',r:'Sol encore frais ('+Math.round(deficit)+' / '+Math.round(thr)+' mm)'};
}
function alerts(){
  if(!wx)return[];const i=T();if(i<0)return[];const d=wx.daily,out=[];
  const dn=k=>new Date(d.time[k]+'T12:00').toLocaleDateString('fr-FR',{weekday:'long'});
  for(let k=i;k<Math.min(d.time.length,i+7);k++){
    const mn=d.temperature_2m_min[k];
    if(mn<=0){
      const tender=S.plants.filter(P=>{const sp=getSp(P.sid);return mn<=sp.h+(P.age!=='old'?10:8)});
      const names=[...new Set(tender.map(P=>getSp(P.sid).n))];
      out.push({c:'frost',t:'Gel prévu '+(k===i?'aujourd’hui':dn(k))+' ('+Math.round(mn)+' °C)',d:names.length?'À protéger : '+names.join(', ')+'.':'Rien de sensible à protéger dans ton jardin.'});
      break;
    }
  }
  for(let k=i;k<Math.min(d.time.length,i+5);k++){
    if(d.temperature_2m_max[k]>=35){out.push({c:'heat',t:'Canicule '+(k===i?'aujourd’hui':dn(k))+' ('+Math.round(d.temperature_2m_max[k])+' °C)',d:'Arroser copieusement tôt le matin : jeunes arbres, pots, hortensias, érable du Japon. Pailler.'});break}
  }
  for(let k=i;k<Math.min(d.time.length,i+3);k++){
    if(d.wind_gusts_10m_max[k]>=70){out.push({c:'wind',t:'Vent fort '+(k===i?'aujourd’hui':dn(k))+' (rafales '+Math.round(d.wind_gusts_10m_max[k])+' km/h)',d:'Vérifier tuteurs et attaches des jeunes arbres.'});break}
  }
  for(let k=i;k<Math.min(d.time.length,i+3);k++){
    if(d.precipitation_sum[k]>=30){out.push({c:'rain',t:'Fortes pluies '+(k===i?'aujourd’hui':dn(k))+' ('+Math.round(d.precipitation_sum[k])+' mm)',d:'Inutile d’arroser ; vérifier l’évacuation des eaux autour des jeunes plantations.'});break}
  }
  return out;
}

function tasksFor(m,y){
  const seen=new Set(),out=[];
  S.plants.forEach(P=>{
    if(seen.has(P.sid))return;seen.add(P.sid);const sp=getSp(P.sid);
    inM(sp.pr,m).forEach((e,k)=>out.push({id:sp.id+'|taille|'+k+'|'+y+'-'+m,sp,kind:'taille',text:e[1]}));
    inM(sp.fd,m).forEach((e,k)=>out.push({id:sp.id+'|engrais|'+k+'|'+y+'-'+m,sp,kind:'engrais',text:e[1]}));
    inM(sp.x,m).forEach((e,k)=>out.push({id:sp.id+'|'+e[2]+'|'+k+'|'+y+'-'+m,sp,kind:e[2],text:e[1]}));
  });
  const order=['protection','taille','engrais','soin','traitement','récolte'];
  return out.sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind)||a.sp.n.localeCompare(b.sp.n));
}

function updateImgs(){

async function wikiThumbs(lang,titles){
  const out={};
  for(let i=0;i<titles.length;i+=25){
    const batch=titles.slice(i,i+25);
    const u='https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=640&redirects=1&origin=*&titles='+encodeURIComponent(batch.join('|'));
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const q=(await r.json()).query||{};
    const norm={},redir={},byTitle={};
    (q.normalized||[]).forEach(x=>norm[x.from]=x.to);(q.redirects||[]).forEach(x=>redir[x.from]=x.to);
    Object.values(q.pages||{}).forEach(p=>byTitle[p.title]=p);
    batch.forEach(t=>{let k=t;if(norm[k])k=norm[k];if(redir[k])k=redir[k];const p=byTitle[k];if(p&&p.thumbnail&&p.thumbnail.source)out[t]={u:p.thumbnail.source,t:p.title}});
  }
  return out;
}
let imgBusy=false;
async function loadImgs(list){
  if(imgBusy)return;
  const old=Date.now()-7*864e5;
  let pending=list.filter(sp=>sp.wp&&(!IMG[sp.id]||(!IMG[sp.id].u&&IMG[sp.id].at<old)));
  if(!pending.length)return;
  imgBusy=true;
  try{
    for(const [lang,idx] of [['fr',0],['en',1]]){
      if(!pending.length)break;
      const titles=[...new Set(pending.map(sp=>sp.wp[idx]||sp.wp[0]))];
      const res=await wikiThumbs(lang,titles);
      pending=pending.filter(sp=>{const h=res[sp.wp[idx]||sp.wp[0]];if(h){IMG[sp.id]={u:h.u,t:h.t,l:lang,at:Date.now()};return false}return true});
      saveImg();updateImgs();
    }
    pending.forEach(sp=>IMG[sp.id]={u:null,at:Date.now()});
    saveImg();
  }catch(e){/* réseau indisponible : on réessaiera plus tard, sans mémoriser d’échec */}
  imgBusy=false;
}
const creditHtml=sp=>{
  const m=IMG[sp.id];if(!m||!m.u)return '';
  const lat=encodeURIComponent((sp.l||sp.n).replace(/\s*\(.*\)/,''));
  return `<p class="credit">Photo : <a href="https://${m.l}.wikipedia.org/wiki/${encodeURIComponent(m.t.replace(/ /g,'_'))}" target="_blank" rel="noopener">Wikipédia — ${esc(m.t)}</a> (licence libre, auteur indiqué sur la page) · <a href="https://commons.wikimedia.org/w/index.php?search=${lat}&ns6=1" target="_blank" rel="noopener">Plus de photos</a></p>`;
};
function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const sc=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

   ${watch.map(sp=>`<div class="vul w"><b>${sp.e} ${esc(sp.n)} <span class="sub" style="font-weight:400">· à surveiller (${dots(sp.now)} → ${dots(sp.fut)})</span></b><span class="sub">${esc(sp.futNote)}</span></div>`).join('')}

     <li>13,7 °C de moyenne, 1 094 mm de pluie par an</li><li>≈ 29 jours de gel par an, dont ≈ 3 à −5 °C ou moins (record de la fiche : −15 °C en 1956)</li><li>≈ 20 jours à 30 °C ou plus ; pointes à 41 °C en juin 2022 (AUDAP)</li></ul></div>

    <li><a href="https://www.ecologie.gouv.fr/sites/default/files/documents/27012026_DP_TRACC.pdf" target="_blank" rel="noopener">Ministère de la Transition écologique — dossier TRACC (trajectoire de réchauffement)</a></li>
    <li><a href="https://www.audap.org/fileadmin/2-Ressources/mediatheque/etudes/fichiers/la_note_15_bv4.pdf" target="_blank" rel="noopener">AUDAP — note n°15, climat du Sud-Aquitain</a></li>
    <li><a href="https://pa.chambre-agriculture.fr/fileadmin/user_upload/Nouvelle-Aquitaine/106_Inst-Pyrenees-Atlantiques/Actus-agendas/2023/changement.pdf" target="_blank" rel="noopener">Chambre d’agriculture 64 — changement climatique</a></li></ul>
    <p class="sub">Les notes ● de 0 à 3 sont <b>mon estimation</b> à partir de ces données (rusticité habituelle, besoin en eau, sensibilité au gel tardif), pas le résultat d’un modèle. Les rusticités (≈ °C) sont des ordres de grandeur ; elles varient selon la variété, le sol et l’abri. Ces chiffres sont ceux de Pau : si ton jardin est ailleurs (coteau, vallée), ajuste.</p></details></div>`;
}

/* ============ Événements ============ */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const nowIso=()=>new Date().toISOString();
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'go':go(id);break;
    case 'close':closeSheet();break;
    case 'wx':toast('Actualisation de la météo…');refreshWx(true);break;
    case 'task':S.done[id]=el.checked||undefined;if(!el.checked)delete S.done[id];save();render();break;
    case 'watered':{const P=S.plants.find(p=>p.id===id);if(P){P.lastWater=nowIso();save();render()}break}
    case 'wateredAll':S.plants.forEach(P=>{if(waterAdvice(P).s==='water')P.lastWater=nowIso()});save();render();toast('Arrosage enregistré');break;
    case 'watered1':{const P=S.plants.find(p=>p.id===id);if(P){P.lastWater=nowIso();save();render();plantSheet(id)}break}
    case 'filter':gFilter=id;render();break;
    case 'plant':plantSheet(id);break;
    case 'spinfo':spSheet(id);break;
    case 'guide':guideSheet(id);break;
    case 'pftype':pf.type=id;render();break;
    case 'pfrole':pf.role=id;render();break;
    case 'pfnow':pf.now=!pf.now;render();break;
    case 'rmphoto':{const P=S.plants.find(p=>p.id===id);if(P){delete P.photo;save();render();plantSheet(id)}break}
    case 'add':addSheet();break;
    case 'addSp':addPlant(id);break;
    case 'customForm':customForm();break;
    case 'saveCustom':saveCustom();break;
    case 'qty':{const P=S.plants.find(p=>p.id===id);if(P){P.qty=Math.max(1,P.qty+(+el.dataset.d));save();render();plantSheet(id)}break}
    case 'del':if(confirm('Retirer cette plante de ton jardin ?')){S.plants=S.plants.filter(p=>p.id!==id);save();closeSheet();render()}break;
    case 'month':calM=+id;render();break;
    case 'city':cityLookup();break;
    case 'pickcity':{S.loc={name:el.dataset.name,lat:+el.dataset.lat,lon:+el.dataset.lon};save();wx=null;render();refreshWx(true);toast('Lieu mis à jour');break}
    case 'geo':geolocate();break;
    case 'export':exportData();break;
    case 'linkNew':linkFile(true);break;
    case 'linkOpen':linkFile(false);break;
    case 'unlink':fileHandle=null;idbDel('fh');idbHandle=false;render();break;
    case 'relink':relink();break;
    case 'reset':if(confirm('Réinitialiser tout le jardin ?')){S=defaults();save();render();toast('Jardin réinitialisé')}break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='gq'){gQuery=ev.target.value;render()}
  if(ev.target.id==='cq'){$('#cl').innerHTML=catList(ev.target.value)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='imp'){importFile(t.files[0]);return}
  if(t.id==='soilSel'){S.soil=t.value;save();render();return}
  if(t.id==='photoIn'){
    const P=S.plants.find(p=>p.id===t.dataset.id),f=t.files[0];if(!P||!f)return;
    readPhoto(f).then(u=>{P.photo=u;save();render();plantSheet(P.id);toast('Photo enregistrée')}).catch(()=>toast('Photo illisible'));return}
  const k=t.dataset.change;if(!k)return;
  const P=S.plants.find(p=>p.id===t.dataset.id);if(!P)return;
  if(k==='age')P.age=t.value;if(k==='pot')P.pot=t.checked;if(k==='note')P.note=t.value;
  save();render();if(k!=='note')plantSheet(P.id);
});

async function cityLookup(){
  const q=$('#cityq').value.trim();if(!q)return;
  const box=$('#cityres');box.innerHTML='<p class="sub">Recherche…</p>';
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=fr&format=json');
    const j=await r.json();
    box.innerHTML=(j.results||[]).map(c=>`<div class="row"><div class="tx"><b>${esc(c.name)}</b><span>${esc([c.admin2,c.admin1,c.country].filter(Boolean).join(', '))}</span></div><button class="btn sm ghost" data-act="pickcity" data-name="${esc(c.name)}" data-lat="${c.latitude}" data-lon="${c.longitude}">Choisir</button></div>`).join('')||'<p class="sub">Aucun résultat.</p>';
  }catch(e){box.innerHTML='<p class="sub">Recherche impossible hors-ligne.</p>'}
}
function geolocate(){
  if(!navigator.geolocation){toast('Géolocalisation indisponible');return}
  navigator.geolocation.getCurrentPosition(p=>{S.loc={name:'Ma position',lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)};save();wx=null;render();refreshWx(true)},()=>toast('Position refusée'));
}

/* ---------- Export / import / fichier lié ---------- */
const payload=()=>JSON.stringify({app:'mon-jardin',...S},null,1);
async function exportData(){
  const blob=new Blob([payload()],{type:'application/json'});
  const file=new File([blob],'jardin-donnees.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Mon Jardin'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jardin-donnees.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function applyData(d){
  if(!d||!Array.isArray(d.plants))throw new Error('Fichier invalide');
  S={v:1,loc:d.loc||S.loc,plants:d.plants,custom:d.custom||[],done:d.done||{},soil:d.soil||'',updated:d.updated||Date.now()};
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
async function importFile(f){
  if(!f)return;
  try{applyData(JSON.parse(await f.text()));wx=null;render();refreshWx(true);toast('Données importées')}catch(e){toast('Import impossible : fichier invalide')}
}
/* IndexedDB pour mémoriser le fichier lié */
let idbHandle=false;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('jardin',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbDel(k){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
const FT=[{description:'Données Mon Jardin',accept:{'application/json':['.json']}}];
async function writeFile(){
  if(!fileHandle)return;
  try{const w=await fileHandle.createWritable();await w.write(payload());await w.close();syncMsg='Dernière sauvegarde fichier : '+new Date().toLocaleTimeString('fr-FR')}
  catch(e){syncMsg='Écriture impossible : reconnecte le fichier.'}
}
async function readFileData(){const f=await fileHandle.getFile();return JSON.parse(await f.text())}
async function linkFile(create){
  try{
    if(create){fileHandle=await showSaveFilePicker({suggestedName:'jardin-donnees.json',types:FT});await writeFile()}
    else{[fileHandle]=await showOpenFilePicker({types:FT});const d=await readFileData();applyData(d);refreshWx(true)}
    idbHandle=true;await idbSet('fh',fileHandle);render();toast('Fichier lié');
  }catch(e){if(e.name!=='AbortError')toast('Liaison impossible')}
}
async function relink(){
  try{
    const h=await idbGet('fh');if(!h)return;
    if((await h.requestPermission({mode:'readwrite'}))!=='granted')return;
    fileHandle=h;await syncFromFile();render();
  }catch(e){toast('Reconnexion impossible')}
}
async function syncFromFile(){
  try{
    const d=await readFileData();
    if(d&&d.updated>S.updated){applyData(d);syncMsg='Données mises à jour depuis le fichier.';wx=null;refreshWx(true)}
    else{await writeFile()}
  }catch(e){await writeFile()}
}
(async()=>{if('showSaveFilePicker' in window){idbHandle=!!(await idbGet('fh'));render()}})();

/* ============ Démarrage ============ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
refreshWx(false);
setInterval(()=>refreshWx(false),30*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshWx(false)});
</script>
</body>
</html>
